name: archive

# Hourly: append every complete hour since the last archived one to the `data` branch,
# verify, then push. GitHub may run schedules late or skip them; the next run backfills
# the gap from archive-state RPC reads (real chain values only, never estimates).
# A failed integrity check pushes nothing.

on:
  schedule:
    # twice an hour: GitHub starts scheduled runs late or skips them; a run with no new
    # complete hour exits quickly, and the concurrency group never overlaps two runs
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # on the job, not the workflow: the pacer below must not hold the group while it waits
    concurrency:
      group: archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Only the manifest, state and the current + previous month of raw files:
      # older day files are never written again (store.mjs SPARSE_DAYS).
      - name: Months to check out
        id: months
        run: |
          echo "cur=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "prev=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: data
          path: tape-data
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /v1/manifest.json
            /state/
            /v1/*/*/${{ steps.months.outputs.prev }}/
            /v1/*/*/${{ steps.months.outputs.cur }}/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # A52: the verifiers' verdicts of finished runs into the tape's working state (one run behind)
      - name: Verification log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tape/log-verifications.mjs --out tape-data

      - name: Archive
        id: archive
        continue-on-error: true
        run: node scripts/tape/archive.mjs --out tape-data --max-hours 48

      - name: Verify (integrity, continuity, append-only)
        run: node scripts/tape/verify-archive.mjs --dir tape-data --offline

      - name: Exactness (50 random points + one whole hour per chain, re-read at their blocks)
        run: node scripts/tape/verify-exact.mjs --dir tape-data --sample 50

      - name: Derived candles (read by the app and the MCP server)
        run: node scripts/tape/build-derived.mjs --dir tape-data --prices

      - name: Push
        working-directory: tape-data
        run: |
          git config user.name "aero-tape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # derived/ lives on its own branch (A46): drop it from the data branch once, never add it again
          if git ls-files --error-unmatch derived/v1/index.json > /dev/null 2>&1; then git rm -r -q --cached --sparse derived; fi
          git add v1 state
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -q -m "tape: archive run ${GITHUB_RUN_ID}"
          git push origin HEAD:data

      # Derived files are a deterministic rebuild of v1: they live on their own orphan branch,
      # replaced by one commit per run, so they never grow the repo's history (A46).
      - name: Derived to the `derived` branch (one commit, replaced each run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/derived-branch" && mkdir -p "$RUNNER_TEMP/derived-branch"
          cp -r tape-data/derived "$RUNNER_TEMP/derived-branch/derived"
          cd "$RUNNER_TEMP/derived-branch"
          git init -q -b derived
          git config user.name "aero-tape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived
          git commit -q -m "derived: archive run ${GITHUB_RUN_ID} (rebuilt from v1 on the data branch)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" derived:derived

      - name: Idle reconciliation (total = allocated + idle, token by token, newest hour)
        run: node scripts/tape/verify-idle.mjs --dir tape-data

      - name: Protocol parity (fee revenue from the tape == earnedFees, 25 veNFTs)
        run: node scripts/tape/verify-parity.mjs --dir tape-data --tokens 25

      - name: Gauge emissions (derived candles == fresh gaugeStates, 20 random)
        run: node scripts/tape/verify-emissions.mjs --dir tape-data --sample 20

      - name: Archive health (index == a recount of the run log)
        run: node scripts/tape/verify-health.mjs --dir tape-data

      - name: Freshness (every chain within 3h of its head)
        run: node scripts/tape/verify-archive.mjs --dir tape-data

      - name: Fail if the archive step failed
        if: steps.archive.outcome == 'failure'
        run: exit 1

  # GitHub starts scheduled runs late or not at all on this repo (one every 2-5 h observed),
  # so each run dispatches the next one for :17 of the next hour. A dispatch made with
  # GITHUB_TOKEN is allowed to start a run. Only the newest run's pacer dispatches, so
  # schedule, manual and paced runs never multiply.
  next:
    needs: archive
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
    steps:
      - name: Wait for :17 of the next hour
        run: |
          now=$(date -u +%s)
          next=$(( (now / 3600 + 1) * 3600 + 17 * 60 ))
          echo "sleeping $(( next - now )) s until $(date -u -d @$next +%H:%M)Z"
          sleep $(( next - now ))
      - name: Dispatch the next archive run (unless a newer run covers this hour)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A newer run covers this hour only if it started at :12 or later (before that, Ethereum and
          # the OP chains' safe head has not reached the new hour, so it archives nothing new), or if
          # its own pacer targets this same :17. A late schedule run at :05 used to silence this
          # dispatch and leave the hour to the next one: samples up to 140 min old (A56, 2026-10-27).
          target=$(( $(date -u +%s) / 3600 * 3600 + 17 * 60 ))
          mine=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          newer=$(gh run list -R "$GITHUB_REPOSITORY" --workflow archive.yml -L 20 --json createdAt,databaseId \
            --jq "[.[] | select(.createdAt > \"$mine\" and .databaseId != $GITHUB_RUN_ID) | (.createdAt | fromdateiso8601) as \$c
                  | select(\$c >= $target - 300 or ((((\$c + 600) / 3600) | floor) + 1) * 3600 + 1020 == $target)] | length")
          if [ "$newer" -gt 0 ]; then echo "a newer run covers $(date -u -d @$target +%H:%M)Z ($newer): not dispatching"; exit 0; fi
          gh workflow run archive.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "dispatched the next run"
