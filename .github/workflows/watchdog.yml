name: watchdog

# OPS-2: reads the archive from outside the archive job, so a stuck or absent run is still seen.
on:
  schedule:
    - cron: "23 * * * *"
    # OPS-4: the first hour after the week boundary (Thursday 00:00 UTC) is saved
    - cron: "45 0 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: "Dry run: stale or boundary opens or updates the issue, healthy closes it"
        type: choice
        options: ["", "stale", "healthy", "boundary"]
        default: ""

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Check the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: node scripts/tape/watchdog.mjs ${FORCE:+--force-$FORCE}
